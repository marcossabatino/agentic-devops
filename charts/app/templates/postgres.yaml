apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: lab-data
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab-data
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lab-data
  labels: {app.kubernetes.io/part-of: agentic-devops}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: agentic-devops, app.kubernetes.io/name: postgres}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ required "Set postgres.image to the pinned image" .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: lab}
            - {name: POSTGRES_USER, value: lab_owner}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: password}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe:
            exec: {command: [pg_isready, '-U', lab_owner, '-d', lab]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, '-U', lab_owner, '-d', lab]}
            periodSeconds: 10
          startupProbe:
            exec: {command: [pg_isready, '-U', lab_owner, '-d', lab]}
            periodSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: socket
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
