apiVersion: batch/v1
kind: Job
metadata:
  name: lab-migrate-{{ .Values.image.tag }}
  namespace: lab-data
  labels: {app.kubernetes.io/part-of: agentic-devops, app.kubernetes.io/name: migrate}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: agentic-devops, app.kubernetes.io/name: migrate}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: credentials, mountPath: /var/run/lab, readOnly: true}
      volumes:
        - name: credentials
          secret: {secretName: migrate-credentials, defaultMode: 0440}
