{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: agentic-devops}
data:
  config.yaml: |
{{ index $.Values.configs $name | indent 4 }}
{{- if eq $name "grafana" }}
  dashboard.json: |
{{ $.Values.dashboard | indent 4 }}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: lab
        orgId: 1
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/lab/dashboards
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: agentic-devops}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: agentic-devops}
      annotations:
        lab/config-checksum: {{ printf "%s%s" (index $.Values.configs $name) $.Values.dashboard | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $component.user }}
        runAsGroup: {{ $component.user }}
        fsGroup: {{ $component.user }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ required "Digest-pinned observability image required" (index $.Values.images $name) | quote }}
          imagePullPolicy: IfNotPresent
          {{- if $component.args }}
          args: {{ $component.args | toJson }}
          {{- end }}
          ports:
          {{- range $component.ports }}
            - {name: {{ .name }}, containerPort: {{ .port }}}
          {{- end }}
          {{- if eq $name "grafana" }}
          env:
            - {name: GF_PATHS_DATA, value: /var/lib/lab}
            - {name: GF_PATHS_LOGS, value: /tmp/logs}
            - {name: GF_PATHS_PLUGINS, value: /var/lib/lab/plugins}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: 'true'}
            - {name: GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION, value: 'true'}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: 'false'}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: 'true'}
          {{- end }}
          resources: {{ $component.resources | toJson }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {{ $component.readiness | toJson }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {{ $component.readiness | toJson }}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet: {{ $component.readiness | toJson }}
            periodSeconds: 5
            failureThreshold: 36
          volumeMounts:
            - {name: config, mountPath: /etc/lab, readOnly: true}
            - {name: storage, mountPath: /var/lib/lab}
            - {name: tmp, mountPath: /tmp}
            {{- if eq $name "grafana" }}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/lab.yaml, subPath: config.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/lab.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: config, mountPath: /var/lib/lab/dashboards/lab.json, subPath: dashboard.json, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: '{{ $name }}-config'}
        - name: storage
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: agentic-devops}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports:
    {{- range $component.ports }}
    - {name: {{ .name }}, port: {{ .port }}, targetPort: {{ .name }}}
    {{- end }}
{{- end }}
