name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python and PostgreSQL contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned application dependencies and PostgreSQL
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Unit and HTTP regression
        run: make test
      - name: Real PostgreSQL and HTTP contracts
        run: make verify-durable PYTHON_DURABLE=python

  static:
    name: Ansible, OpenTofu and Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Install pinned Ansible lint tools
        run: python -m pip install ansible-core==2.20.5 ansible-lint==26.4.0 ruff==0.13.3
      - name: Python and interface syntax
        run: |
          ruff check --select E4,E7,E9,F app scripts tests
          node --check app/static/app.js
      - name: Validate without a Kubernetes cluster
        run: make verify-static

  image:
    name: Build application image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build from pinned base image
        run: |
          base_image="$(python3 -c 'import json; print(json.load(open("config/images.json"))["python"])')"
          docker build --build-arg "PYTHON_IMAGE=$base_image" -t "agentic-devops:${GITHUB_SHA}" .
          docker image inspect "agentic-devops:${GITHUB_SHA}" --format '{{.Id}}'
